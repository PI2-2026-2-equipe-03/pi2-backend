# compose base do backend — configuração de PRODUÇÃO.
# em dev, o docker-compose.override.yml é carregado automaticamente por `docker compose up`.
# em produção, ignore o override: `docker compose -f docker-compose.yml up -d --build`.
# o nome fixo mantém o volume do banco já existente.
# variáveis: o container recebe apenas o que está em `environment` (sem env_file);
# obrigatórias usam `:?` e o compose falha se faltarem. Referência: .env.example.
name: pi2-backend

services:
  db:
    image: postgres:16-alpine
    container_name: tagravado-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    # sem porta publicada: o backend acessa o banco pela rede interna.
    volumes:
      - tagravado_db_data:/var/lib/postgresql/data
      # o script aplica as migrações e, se /seed estiver montado (apenas em dev), o seed.
      - ./src/db/docker-init.sh:/docker-entrypoint-initdb.d/docker-init.sh:ro
      - ./src/db/init:/migrations:ro
    healthcheck:
      # $$ lê as variáveis do próprio container, já validadas acima.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pi2-net

  backend:
    build:
      context: .
      # stage de produção do Dockerfile multi-stage (dist compilado + deps sem dev).
      target: runner
    container_name: tagravado-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:?defina BACKEND_PORT no .env}:3000"
    environment:
      # fixos no compose.
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      # backend conecta no db pelo nome do serviço na rede interna; o Postgres do compose não usa TLS.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DB_SSL: "false"
      # obrigatórias.
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?defina BETTER_AUTH_URL no .env}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?defina BETTER_AUTH_SECRET no .env}
      CORS_ORIGINS: ${CORS_ORIGINS:?defina CORS_ORIGINS no .env}
      DB_POOL_MAX: ${DB_POOL_MAX:?defina DB_POOL_MAX no .env}
      AUTH_DB_POOL_MAX: ${AUTH_DB_POOL_MAX:?defina AUTH_DB_POOL_MAX no .env}
      AUTH_LOCK_POOL_MAX: ${AUTH_LOCK_POOL_MAX:?defina AUTH_LOCK_POOL_MAX no .env}
      UPLOAD_URL_TTL_SECONDS: ${UPLOAD_URL_TTL_SECONDS:?defina UPLOAD_URL_TTL_SECONDS no .env}
      DOWNLOAD_URL_TTL_SECONDS: ${DOWNLOAD_URL_TTL_SECONDS:?defina DOWNLOAD_URL_TTL_SECONDS no .env}
      # integrações opcionais: vazias, a funcionalidade fica desativada (503).
      CRON_SECRET: ${CRON_SECRET:-}
      SUPABASE_CA_CERT: ${SUPABASE_CA_CERT:-}
      EMAIL_DELIVERY_URL: ${EMAIL_DELIVERY_URL:-}
      EMAIL_DELIVERY_TOKEN: ${EMAIL_DELIVERY_TOKEN:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    # sem bind mount em produção: o container roda apenas o que foi copiado para a imagem.
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - pi2-net

networks:
  pi2-net:
    name: pi2-net
    driver: bridge
    external: true

volumes:
  tagravado_db_data:
