services:
  db:
    image: postgres:16-alpine
    container_name: tagravado-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - tagravado_db_data:/var/lib/postgresql/data
      - ./src/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tagravado-api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "${API_PORT}:3000"
    volumes:
      - ./src:/app/src
      - ./package.json:/app/package.json
      - ./tsconfig.json:/app/tsconfig.json
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ../pi2-frontend
    container_name: tagravado-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://${HOST_IP}:${API_PORT}
      VITE_USE_MOCKS: "false"
    ports:
      - "${FRONTEND_PORT}:5173"
    depends_on:
      - api

volumes:
  tagravado_db_data: